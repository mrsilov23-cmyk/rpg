<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backpack Brawl Online</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: #0a0e1a;
  color: #e8edf7;
  min-height: 100vh;
  overflow-x: hidden;
}

.screen { display: none; min-height: 100vh; }
.screen.active { display: block; }

/* ============ ЭКРАН ВХОДА ============ */
#loginScreen {
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: radial-gradient(circle at center, #1a1a2e 0%, #0a0e1a 100%);
  min-height: 100vh;
}
#loginScreen.active { display: flex; }

.login-box {
  background: #16161f;
  border: 1px solid #2a2a3a;
  border-radius: 16px;
  padding: 32px;
  width: 520px;
  max-width: 95vw;
  box-shadow: 0 0 60px rgba(120, 80, 200, 0.25);
}

.login-box h1 {
  color: #b48cff;
  margin-bottom: 8px;
  text-align: center;
  font-size: 28px;
  text-shadow: 0 0 20px rgba(180, 140, 255, 0.5);
}

.login-box .subtitle {
  text-align: center;
  color: #8888a0;
  margin-bottom: 24px;
  font-size: 13px;
}

.login-box label {
  display: block;
  color: #a0a0b0;
  font-size: 12px;
  margin-bottom: 6px;
  margin-top: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.login-box input {
  width: 100%;
  padding: 12px 16px;
  background: #0a0e1a;
  border: 1px solid #2a2a3a;
  color: #fff;
  border-radius: 8px;
  font-size: 15px;
}

.login-box input:focus {
  outline: none;
  border-color: #b48cff;
  box-shadow: 0 0 0 3px rgba(180, 140, 255, 0.15);
}

#enterBtn {
  width: 100%;
  padding: 14px;
  margin-top: 20px;
  background: linear-gradient(135deg, #6a4cba, #b48cff);
  border: none;
  color: #fff;
  font-size: 16px;
  font-weight: bold;
  border-radius: 10px;
  cursor: pointer;
  transition: transform 0.15s;
}

#enterBtn:hover { transform: scale(1.02); }

#onlineBox {
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid #2a2a3a;
  color: #8888a0;
  font-size: 13px;
  max-height: 200px;
  overflow-y: auto;
}

.online-item {
  padding: 6px 10px;
  background: #1a1a26;
  border-radius: 6px;
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.online-item .name { color: #e8edf7; font-weight: 600; }
.online-item .status { color: #6aff8c; font-size: 11px; }

/* ============ ИГРОВОЙ ЭКРАН ============ */
#gameScreen {
  padding: 12px;
  max-width: 1400px;
  margin: 0 auto;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  background: #16161f;
  border: 1px solid #2a2a3a;
  border-radius: 12px;
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 12px;
}

.player-hud {
  display: flex;
  gap: 20px;
  align-items: center;
  flex-wrap: wrap;
}

.hud-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.hud-stat .label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #666;
}

.hud-stat .value {
  font-size: 20px;
  font-weight: bold;
  color: #e8edf7;
  font-family: 'Consolas', monospace;
}

.hud-stat.hp .value { color: #6aff8c; }
.hud-stat.gold .value { color: #ffd76a; }
.hud-stat.round .value { color: #b48cff; }
.hud-stat.wins .value { color: #6ab4ff; }

.main-grid {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: start;
}

@media (max-width: 1100px) {
  .main-grid { grid-template-columns: 1fr; }
}

.panel {
  background: #16161f;
  border: 1px solid #2a2a3a;
  border-radius: 12px;
  padding: 14px;
}

.panel h2 {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: #b48cff;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid #2a2a3a;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* ============ СЕТКА РЮКЗАКА ============ */
.backpack-grid {
  display: grid;
  grid-template-columns: repeat(6, 60px);
  grid-template-rows: repeat(5, 60px);
  gap: 4px;
  padding: 8px;
  background: #0a0e1a;
  border-radius: 10px;
  border: 2px dashed #2a2a3a;
}

.bp-cell {
  background: #1a1a26;
  border-radius: 6px;
  border: 1px solid #232c42;
  position: relative;
  transition: all 0.15s;
}

.bp-cell.drop-ok {
  background: rgba(106, 255, 140, 0.15);
  border-color: #6aff8c;
}

.bp-cell.drop-bad {
  background: rgba(255, 100, 100, 0.15);
  border-color: #ff6a6a;
}

/* ============ ПРЕДМЕТЫ ============ */
.item-card {
  position: absolute;
  border-radius: 6px;
  cursor: grab;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  user-select: none;
  transition: transform 0.15s, box-shadow 0.15s;
  border: 2px solid transparent;
  z-index: 5;
}

.item-card:hover {
  transform: scale(1.05);
  z-index: 10;
  box-shadow: 0 0 15px rgba(180, 140, 255, 0.5);
}

.item-card.dragging {
  opacity: 0.5;
  cursor: grabbing;
  z-index: 100;
}

.item-card.weapon { background: linear-gradient(135deg, #4a2a2a, #2a1a1a); border-color: #ff8888; }
.item-card.armor  { background: linear-gradient(135deg, #2a3a5a, #1a2a3a); border-color: #6ab4ff; }
.item-card.potion { background: linear-gradient(135deg, #2a4a2a, #1a2a1a); border-color: #6aff8c; }
.item-card.tool   { background: linear-gradient(135deg, #4a4a2a, #2a2a1a); border-color: #ffd76a; }
.item-card.ring   { background: linear-gradient(135deg, #4a2a4a, #2a1a2a); border-color: #d76aff; }

.item-card .size-badge {
  position: absolute;
  bottom: 2px;
  right: 4px;
  font-size: 9px;
  color: #888;
  font-weight: bold;
}

/* ============ МАГАЗИН ============ */
.shop-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 600px;
  overflow-y: auto;
  padding-right: 4px;
}

.shop-item {
  display: flex;
  gap: 10px;
  padding: 10px;
  background: #1a1a26;
  border: 1px solid #2a2a3a;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s;
  align-items: center;
}

.shop-item:hover {
  border-color: #b48cff;
  background: #1e1e2e;
}

.shop-item.disabled {
  opacity: 0.4;
  cursor: not-allowed;
  border-color: #4a2a2a;
}

.shop-item .si-icon {
  font-size: 28px;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0a0e1a;
  border-radius: 8px;
  flex-shrink: 0;
}

.shop-item .si-info { flex: 1; min-width: 0; }
.shop-item .si-name { font-weight: bold; color: #e8edf7; font-size: 13px; }
.shop-item .si-desc { color: #8888a0; font-size: 11px; margin-top: 3px; line-height: 1.4; }
.shop-item .si-price {
  font-family: 'Consolas', monospace;
  font-weight: bold;
  color: #ffd76a;
  font-size: 14px;
  flex-shrink: 0;
}

/* ============ ИНФО ПРЕДМЕТА ============ */
.item-info {
  margin-top: 12px;
  padding: 10px;
  background: #0a0e1a;
  border: 1px solid #2a2a3a;
  border-radius: 8px;
  min-height: 80px;
  font-size: 12px;
  color: #a0a0b0;
}

.item-info .ii-name { color: #b48cff; font-weight: bold; font-size: 13px; margin-bottom: 4px; }
.item-info .ii-stats { color: #6aff8c; font-family: monospace; margin-top: 6px; line-height: 1.6; }

/* ============ КНОПКИ ============ */
.btn {
  padding: 12px 24px;
  border-radius: 10px;
  border: none;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  transition: transform 0.15s;
  font-family: inherit;
}

.btn:hover { transform: scale(1.03); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.btn-primary {
  background: linear-gradient(135deg, #6a4cba, #b48cff);
  color: #fff;
}

.btn-danger {
  background: linear-gradient(135deg, #ba4c4c, #ff8c8c);
  color: #fff;
}

.btn-success {
  background: linear-gradient(135deg, #4cba6a, #8cffac);
  color: #0a0e1a;
}

.btn-ghost {
  background: transparent;
  border: 1px solid #2a2a3a;
  color: #a0a0b0;
}

.action-bar {
  display: flex;
  gap: 10px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.action-bar .btn { flex: 1; min-width: 120px; }

/* ============ МОДАЛКА БОЯ ============ */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(5, 4, 2, 0.9);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  overflow-y: auto;
}

.overlay.show { display: flex; }

.battle-modal {
  background: #16161f;
  border: 2px solid #b48cff;
  border-radius: 16px;
  padding: 24px;
  max-width: 1100px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 0 60px rgba(180, 140, 255, 0.3);
}

.battle-title {
  text-align: center;
  color: #b48cff;
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 6px;
  letter-spacing: 2px;
}

.battle-sub {
  text-align: center;
  color: #8888a0;
  font-size: 13px;
  margin-bottom: 20px;
}

.battle-arena {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 20px;
  align-items: start;
}

@media (max-width: 800px) {
  .battle-arena { grid-template-columns: 1fr; }
}

.fighter {
  padding: 16px;
  background: #0a0e1a;
  border-radius: 12px;
  border: 2px solid #2a2a3a;
}

.fighter.me { border-color: #6aff8c; }
.fighter.enemy { border-color: #ff6a6a; }

.fighter h3 {
  font-size: 15px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.fighter.me h3 { color: #6aff8c; }
.fighter.enemy h3 { color: #ff6a6a; }

.hp-bar {
  height: 20px;
  background: #1a1a26;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #2a2a3a;
  position: relative;
  margin-bottom: 8px;
}

.hp-bar .fill {
  height: 100%;
  background: linear-gradient(90deg, #4cba6a, #6aff8c);
  transition: width 0.4s;
}

.hp-bar.enemy .fill {
  background: linear-gradient(90deg, #ba4c4c, #ff8c8c);
}

.hp-bar .text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: bold;
  color: #fff;
  text-shadow: 0 1px 2px #000;
}

.fighter-stats {
  display: flex;
  gap: 12px;
  font-size: 12px;
  color: #a0a0b0;
  font-family: monospace;
  flex-wrap: wrap;
}

.fighter-stats span { color: #e8edf7; }

.vs-badge {
  font-size: 28px;
  font-weight: bold;
  color: #b48cff;
  text-shadow: 0 0 20px rgba(180, 140, 255, 0.7);
  padding: 20px;
  display: flex;
  align-items: center;
}

.battle-log {
  margin-top: 20px;
  padding: 12px;
  background: #0a0e1a;
  border-radius: 10px;
  max-height: 200px;
  overflow-y: auto;
  font-family: monospace;
  font-size: 12px;
  line-height: 1.7;
}

.battle-log .log-line { padding: 2px 0; }
.battle-log .log-line.damage { color: #ff8c8c; }
.battle-log .log-line.heal { color: #6aff8c; }
.battle-log .log-line.effect { color: #ffd76a; }
.battle-log .log-line.info { color: #6ab4ff; }
.battle-log .log-line.win { color: #6aff8c; font-weight: bold; font-size: 14px; }
.battle-log .log-line.lose { color: #ff6a6a; font-weight: bold; font-size: 14px; }

/* ============ УВЕДОМЛЕНИЯ ============ */
#notify {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 300;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.notify-item {
  padding: 12px 20px;
  background: #16161f;
  border-left: 4px solid #b48cff;
  border-radius: 8px;
  color: #e8edf7;
  font-size: 14px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.5);
  animation: slideIn 0.3s;
  min-width: 250px;
  max-width: 400px;
}

.notify-item.success { border-color: #6aff8c; }
.notify-item.error { border-color: #ff6a6a; }
.notify-item.info { border-color: #6ab4ff; }

@keyframes slideIn {
  from { transform: translateX(400px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* ============ СТАТУС РАУНДА ============ */
.round-status {
  padding: 10px 16px;
  background: linear-gradient(135deg, rgba(180, 140, 255, 0.15), rgba(106, 180, 255, 0.1));
  border: 1px solid rgba(180, 140, 255, 0.3);
  border-radius: 10px;
  margin-bottom: 12px;
  text-align: center;
  font-size: 14px;
  color: #b48cff;
}

.round-status b { color: #fff; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: #0a0e1a; }
::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #3a3a4a; }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="loginScreen" class="screen active">
  <div class="login-box">
    <h1>🎒 Backpack Brawl</h1>
    <div class="subtitle">Собери рюкзак — победи врага!</div>

    <label>Имя героя</label>
    <input type="text" id="playerName" maxlength="16" placeholder="Например: Рыцарь">

    <button id="enterBtn">Войти в бой</button>

    <div id="onlineBox">
      <div style="text-align:center;color:#666;">Загрузка...</div>
    </div>
  </div>
</div>

<!-- ИГРОВОЙ ЭКРАН -->
<div id="gameScreen" class="screen">
  <div class="top-bar">
    <div class="player-hud">
      <div class="hud-stat hp">
        <div class="label">HP</div>
        <div class="value" id="hudHp">100</div>
      </div>
      <div class="hud-stat gold">
        <div class="label">Золото</div>
        <div class="value" id="hudGold">10</div>
      </div>
      <div class="hud-stat round">
        <div class="label">Раунд</div>
        <div class="value" id="hudRound">1</div>
      </div>
      <div class="hud-stat wins">
        <div class="label">Победы</div>
        <div class="value" id="hudWins">0/0</div>
      </div>
    </div>
    <div>
      <button class="btn btn-ghost" id="leaveBtn">Выйти</button>
    </div>
  </div>

  <div class="round-status" id="roundStatus">
    Раунд <b>1</b> — собери рюкзак и нажми <b>«В бой!»</b>
  </div>

  <div class="main-grid">
    <!-- РЮКЗАК -->
    <div class="panel">
      <h2>🎒 Рюкзак <span style="color:#888;font-size:10px;">(перетаскивай предметы)</span></h2>
      <div class="backpack-grid" id="backpack"></div>
      <div class="item-info" id="itemInfo">
        <div style="color:#666;">Наведи курсор на предмет — увидишь характеристики</div>
      </div>
    </div>

    <!-- МАГАЗИН -->
    <div class="panel">
      <h2>🛒 Магазин</h2>
      <div class="shop-list" id="shopList"></div>
      <div class="action-bar">
        <button class="btn btn-success" id="battleBtn">⚔️ В бой!</button>
        <button class="btn btn-ghost" id="rerollBtn">🔄 Обновить (2💰)</button>
      </div>
    </div>

    <!-- ПРОТИВНИК / ИНФО -->
    <div class="panel">
      <h2>👥 Онлайн</h2>
      <div id="opponentsList" style="max-height:400px;overflow-y:auto;">
        <div style="color:#666;font-size:12px;">Загрузка...</div>
      </div>
    </div>
  </div>
</div>

<!-- МОДАЛКА БОЯ -->
<div id="battleOverlay" class="overlay">
  <div class="battle-modal">
    <div class="battle-title" id="battleTitle">⚔️ БОЙ</div>
    <div class="battle-sub" id="battleSub">Раунд 1</div>

    <div class="battle-arena">
      <div class="fighter me" id="fighterMe"></div>
      <div class="vs-badge">VS</div>
      <div class="fighter enemy" id="fighterEnemy"></div>
    </div>

    <div class="battle-log" id="battleLog"></div>

    <div class="action-bar" style="margin-top:16px;">
      <button class="btn btn-primary" id="battleCloseBtn" disabled>Продолжить</button>
    </div>
  </div>
</div>

<div id="notify"></div>

function addItemToBackpack(itemKey, x, y) {
  const item = ITEMS_DB[itemKey];
  if (!item) return false;
  if (!canPlace(itemKey, x, y, null)) return false;

  state.backpack.push({
    itemKey,
    x, y,
    uid: ++uid
  });
  return true;
}

function canPlace(itemKey, x, y, ignoreUid) {
  const item = ITEMS_DB[itemKey];
  if (!item) return false;
  const [w, h] = item.size;
  if (x + w > GRID_W || y + h > GRID_H) return false;
  if (x < 0 || y < 0) return false;

  for (const placed of state.backpack) {
    if (placed.uid === ignoreUid) continue;
    const p = ITEMS_DB[placed.itemKey];
    const [pw, ph] = p.size;
    // Проверка пересечения прямоугольников
    if (x < placed.x + pw && x + w > placed.x &&
        y < placed.y + ph && y + h > placed.y) {
      return false;
    }
  }
  return true;
}

function renderBackpack() {
  const grid = $("backpack");
  grid.innerHTML = "";
  grid.style.position = "relative";

  // Создаём ячейки
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      const cell = document.createElement("div");
      cell.className = "bp-cell";
      cell.dataset.x = x;
      cell.dataset.y = y;
      grid.appendChild(cell);
    }
  }

  // Рисуем предметы поверх сетки
  const cellSize = 60;
  const gap = 4;
  const padding = 8;

  for (const placed of state.backpack) {
    const item = ITEMS_DB[placed.itemKey];
    const [w, h] = item.size;

    const el = document.createElement("div");
    el.className = "item-card " + item.type;
    el.dataset.uid = placed.uid;
    el.style.left = (padding + placed.x * (cellSize + gap)) + "px";
    el.style.top = (padding + placed.y * (cellSize + gap)) + "px";
    el.style.width = (w * cellSize + (w - 1) * gap) + "px";
    el.style.height = (h * cellSize + (h - 1) * gap) + "px";
    el.style.borderColor = RARITY[item.rarity].color;
    el.innerHTML = `${item.emoji}<span class="size-badge">${w}×${h}</span>`;
    el.title = item.name;

    el.addEventListener("mouseenter", () => showItemInfo(item));
    el.addEventListener("mouseleave", () => hideItemInfo());
    el.addEventListener("mousedown", (e) => startDrag(e, placed));

    grid.appendChild(el);
  }
}

// ============================================================
// DRAG & DROP
// ============================================================
function startDrag(e, placed) {
  e.preventDefault();
  const item = ITEMS_DB[placed.itemKey];
  const [w, h] = item.size;
  const cellSize = 60;
  const gap = 4;
  const padding = 8;

  const el = e.target.closest(".item-card");
  const rect = el.getBoundingClientRect();
  draggingOffset.x = e.clientX - rect.left;
  draggingOffset.y = e.clientY - rect.top;

  dragging = { placed, item, el };

  // Создаём «призрака»
  const ghost = el.cloneNode(true);
  ghost.style.position = "fixed";
  ghost.style.pointerEvents = "none";
  ghost.style.zIndex = "9999";
  ghost.style.opacity = "0.85";
  ghost.style.transform = "scale(1.05) rotate(2deg)";
  ghost.id = "dragGhost";
  document.body.appendChild(ghost);

  el.style.opacity = "0.3";

  moveGhost(e.clientX, e.clientY);

  document.addEventListener("mousemove", onDragMove);
  document.addEventListener("mouseup", onDragEnd);

  // Подсветка ячеек
  highlightCells(placed);
}

function moveGhost(clientX, clientY) {
  const ghost = $("dragGhost");
  if (!ghost) return;
  ghost.style.left = (clientX - draggingOffset.x) + "px";
  ghost.style.top = (clientY - draggingOffset.y) + "px";
}

function onDragMove(e) {
  if (!dragging) return;
  moveGhost(e.clientX, e.clientY);
}

function onDragEnd(e) {
  if (!dragging) return;

  const grid = $("backpack");
  const rect = grid.getBoundingClientRect();
  const cellSize = 60;
  const gap = 4;
  const padding = 8;

  // Позиция курсора относительно сетки
  const relX = e.clientX - rect.left - draggingOffset.x + padding;
  const relY = e.clientY - rect.top - draggingOffset.y + padding;

  // Вычисляем ячейку (левый верхний угол)
  const col = Math.round(relX / (cellSize + gap));
  const row = Math.round(relY / (cellSize + gap));

  // Пробуем разместить
  const placed = dragging.placed;
  const oldX = placed.x, oldY = placed.y;

  if (canPlace(placed.itemKey, col, row, placed.uid)) {
    placed.x = col;
    placed.y = row;
  } else {
    // Пробуем найти ближайшую валидную позицию
    let found = false;
    for (let dy = -1; dy <= 1 && !found; dy++) {
      for (let dx = -1; dx <= 1 && !found; dx++) {
        if (canPlace(placed.itemKey, col + dx, row + dy, placed.uid)) {
          placed.x = col + dx;
          placed.y = row + dy;
          found = true;
        }
      }
    }
    if (!found) {
      notify("Тут не помещается!", "error", 1500);
    }
  }

  dragging.el.style.opacity = "1";
  dragging = null;
  clearHighlights();

  document.removeEventListener("mousemove", onDragMove);
  document.removeEventListener("mouseup", onDragEnd);
  const ghost = $("dragGhost");
  if (ghost) ghost.remove();

  renderBackpack();
  saveState();
}

function highlightCells(placed) {
  const cells = document.querySelectorAll(".bp-cell");
  cells.forEach(c => c.classList.remove("drop-ok", "drop-bad"));
}

function clearHighlights() {
  document.querySelectorAll(".bp-cell").forEach(c => {
    c.classList.remove("drop-ok", "drop-bad");
  });
}

function generateShop() {
  const pool = Object.keys(ITEMS_DB);
  state.shop = [];
  for (let i = 0; i < 6; i++) {
    // Взвешенный рандом по редкости
    const key = pickWeighted(pool);
    state.shop.push(key);
  }
}

function pickWeighted(pool) {
  const weights = pool.map(k => {
    const r = ITEMS_DB[k].rarity;
    return {
      common: 40,
      uncommon: 25,
      rare: 15,
      epic: 7,
      legendary: 3
    }[r] || 10;
  });
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i];
    if (r <= 0) return pool[i];
  }
  return pool[0];
}

function renderShop() {
  const box = $("shopList");
  box.innerHTML = "";

  state.shop.forEach((key, idx) => {
    const item = ITEMS_DB[key];
    const rar = RARITY[item.rarity];
    const canAfford = state.gold >= item.price;

    const div = document.createElement("div");
    div.className = "shop-item" + (canAfford ? "" : " disabled");
    div.innerHTML = `
      <div class="si-icon" style="border:1px solid ${rar.color}">${item.emoji}</div>
      <div class="si-info">
        <div class="si-name" style="color:${rar.color}">${item.name}</div>
        <div class="si-desc">${item.desc}</div>
      </div>
      <div class="si-price">${item.price}💰</div>
    `;
    div.onclick = () => buyItem(idx);
    box.appendChild(div);
  });
}

function buyItem(idx) {
  const key = state.shop[idx];
  const item = ITEMS_DB[key];
  if (state.gold < item.price) return notify("Не хватает золота!", "error");

  // Ищем свободное место
  const spot = findFreeSpot(key);
  if (!spot) return notify("В рюкзаке нет места!", "error");

  state.gold -= item.price;
  addItemToBackpack(key, spot.x, spot.y);
  state.shop.splice(idx, 1);

  notify(`Куплено: ${item.name}`, "success");
  renderBackpack();
  renderShop();
  updateHUD();
  saveState();
}

function findFreeSpot(itemKey) {
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      if (canPlace(itemKey, x, y, null)) return { x, y };
    }
  }
  return null;
}

function buildFighter(name, backpack, baseHp, isMe) {
  const stats = {
    name,
    hp: baseHp,
    maxHp: baseHp,
    armor: 0,
    atkBonus: 0,
    hpBonus: 0,
    critChance: 0,
    lifesteal: 0,
    speedBonus: 0,
    thorn: 0,
    weapons: [],
    potions: [],
    poison: 0
  };

  // Собираем все эффекты
  for (const placed of backpack) {
    const item = ITEMS_DB[placed.itemKey];
    if (!item) continue;
    if (item.armor) stats.armor += item.armor;
    if (item.maxHp) stats.hpBonus += item.maxHp;
    if (item.hpBonus) stats.hpBonus += item.hpBonus;
    if (item.atkBonus) stats.atkBonus += item.atkBonus;
    if (item.critChance) stats.critChance += item.critChance;
    if (item.lifesteal) stats.lifesteal += item.lifesteal;
    if (item.speedBonus) stats.speedBonus += item.speedBonus;
    if (item.thorn) stats.thorn += item.thorn;
    if (item.poison) stats.poison += item.poison;

    if (item.type === "weapon") {
      stats.weapons.push({
        name: item.name,
        emoji: item.emoji,
        damage: item.damage + stats.atkBonus,
        cooldown: item.cooldown / (1 + stats.speedBonus),
        timer: item.cooldown / (1 + stats.speedBonus),
        magic: item.magic || false,
        lifesteal: item.lifesteal || 0
      });
    }
    if (item.type === "potion" && item.heal) {
      stats.potions.push({
        name: item.name,
        emoji: item.emoji,
        heal: item.heal,
        cooldown: item.cooldown,
        timer: item.cooldown
      });
    }
  }

  stats.maxHp = baseHp + stats.hpBonus;
  stats.hp = stats.maxHp;
  return stats;
}

function startBattle() {
  // Находим противника-игрока (не себя)
  const opponentIds = Object.keys(opponentsCache).filter(id => id !== state.playerId);
  if (opponentIds.length === 0) {
    return notify("Нет других игроков онлайн. Сражаемся с ботом!", "info");
  }

  const oppId = opponentIds[Math.floor(Math.random() * opponentIds.length)];
  const opp = opponentsCache[oppId];

  // Если у противника нет рюкзака — бот
  const oppBackpack = opp.backpack && opp.backpack.length > 0 ? opp.backpack : generateBotBackpack(state.round);

  const me = buildFighter(state.name, state.backpack, state.maxHp, true);
  const enemy = buildFighter(opp.name || "Противник", oppBackpack, opp.maxHp || 100, false);

  runBattle(me, enemy, oppId);
}

function generateBotBackpack(round) {
  const bp = [];
  bp.push({ itemKey: "wooden_sword", x: 0, y: 0, uid: 1 });
  bp.push({ itemKey: "leather_armor", x: 2, y: 0, uid: 2 });
  if (round >= 2) bp.push({ itemKey: "healing_potion", x: 4, y: 0, uid: 3 });
  if (round >= 3) bp.push({ itemKey: "iron_sword", x: 0, y: 2, uid: 4 });
  if (round >= 4) bp.push({ itemKey: "chainmail", x: 2, y: 2, uid: 5 });
  if (round >= 5) bp.push({ itemKey: "power_ring", x: 4, y: 2, uid: 6 });
  return bp;
}

function runBattle(me, enemy, oppId) {
  const log = [];
  const overlay = $("battleOverlay");
  overlay.classList.add("show");
  $("battleCloseBtn").disabled = true;
  $("battleSub").textContent = `Раунд ${state.round}`;
  $("battleLog").innerHTML = "";

  renderFighters(me, enemy);

  let t = 0;
  const dt = 0.1;
  const maxTime = 60;
  let meStun = 0, enemyStun = 0;

  const interval = setInterval(() => {
    t += dt;

    // Восстанавливаем HP через зелья
    for (const p of me.potions) {
      p.timer -= dt;
      if (p.timer <= 0) {
        me.hp = Math.min(me.maxHp, me.hp + p.heal);
        log.push({ text: `${me.name}: ${p.emoji} ${p.name} +${p.heal} HP`, cls: "heal" });
        p.timer = p.cooldown;
      }
    }
    for (const p of enemy.potions) {
      p.timer -= dt;
      if (p.timer <= 0) {
        enemy.hp = Math.min(enemy.maxHp, enemy.hp + p.heal);
        log.push({ text: `${enemy.name}: ${p.emoji} ${p.name} +${p.heal} HP`, cls: "heal" });
        p.timer = p.cooldown;
      }
    }

    // Яд
    if (me.poison > 0) {
      me.hp -= me.poison * dt;
    }
    if (enemy.poison > 0) {
      enemy.hp -= enemy.poison * dt;
    }

    // Атаки игрока
    if (meStun <= 0) {
      for (const w of me.weapons) {
        w.timer -= dt;
        if (w.timer <= 0) {
          let dmg = w.damage;
          if (w.magic) {
            // магия игнорирует броню
          } else {
            dmg = Math.max(1, dmg - enemy.armor);
          }
          const isCrit = Math.random() < me.critChance;
          if (isCrit) dmg = Math.floor(dmg * 2);

          enemy.hp -= dmg;
          log.push({
            text: `${me.name}: ${w.emoji} ${w.name} наносит ${dmg} урона${isCrit ? " (КРИТ!)" : ""}`,
            cls: "damage"
          });

          // Вампиризм
          const ls = me.lifesteal + (w.lifesteal || 0);
          if (ls > 0) {
            const heal = Math.floor(dmg * ls);
            me.hp = Math.min(me.maxHp, me.hp + heal);
            if (heal > 0) log.push({ text: `${me.name}: 🩸 Вампиризм +${heal} HP`, cls: "heal" });
          }

          // Шипы врага
          if (enemy.thorn > 0) {
            me.hp -= enemy.thorn;
            log.push({ text: `${me.name}: 🌵 Шипы врага -${enemy.thorn} HP`, cls: "damage" });
          }

          w.timer = w.cooldown;
        }
      }
    } else {
      meStun -= dt;
    }

    // Атаки врага
    if (enemyStun <= 0) {
      for (const w of enemy.weapons) {
        w.timer -= dt;
        if (w.timer <= 0) {
          let dmg = w.damage;
          if (!w.magic) dmg = Math.max(1, dmg - me.armor);
          const isCrit = Math.random() < enemy.critChance;
          if (isCrit) dmg = Math.floor(dmg * 2);

          me.hp -= dmg;
          log.push({
            text: `${enemy.name}: ${w.emoji} ${w.name} наносит ${dmg} урона${isCrit ? " (КРИТ!)" : ""}`,
            cls: "damage"
          });

          const ls = enemy.lifesteal + (w.lifesteal || 0);
          if (ls > 0) {
            const heal = Math.floor(dmg * ls);
            enemy.hp = Math.min(enemy.maxHp, enemy.hp + heal);
            if (heal > 0) log.push({ text: `${enemy.name}: 🩸 Вампиризм +${heal} HP`, cls: "heal" });
          }

          if (me.thorn > 0) {
            enemy.hp -= me.thorn;
            log.push({ text: `${enemy.name}: 🌵 Шипы врага -${me.thorn} HP`, cls: "damage" });
          }

          w.timer = w.cooldown;
        }
      }
    } else {
      enemyStun -= dt;
    }

    // Обновляем визуал
    renderFighters(me, enemy);

    // Финальная проверка
    if (me.hp <= 0 || enemy.hp <= 0 || t > maxTime) {
      clearInterval(interval);
      me.hp = Math.max(0, me.hp);
      enemy.hp = Math.max(0, enemy.hp);

      let result;
      if (me.hp > 0 && enemy.hp <= 0) {
        result = "win";
        log.push({ text: "🏆 ВЫ ПОБЕДИЛИ!", cls: "win" });
      } else if (me.hp <= 0 && enemy.hp > 0) {
        result = "lose";
        log.push({ text: "💀 ВЫ ПРОИГРАЛИ", cls: "lose" });
      } else if (me.hp <= 0 && enemy.hp <= 0) {
        result = "win";
        log.push({ text: "🤝 ДВОЙНОЙ НОКАУТ — засчитано как победа!", cls: "win" });
      } else {
        // Тайм-аут: сравниваем по HP
        const mePct = me.hp / me.maxHp;
        const enPct = enemy.hp / enemy.maxHp;
        if (mePct >= enPct) {
          result = "win";
          log.push({ text: "⏱️ Время вышло! Победа по HP.", cls: "win" });
        } else {
          result = "lose";
          log.push({ text: "⏱️ Время вышло! Поражение по HP.", cls: "lose" });
        }
      }

      renderFighters(me, enemy);
      renderBattleLog(log);

      // Обрабатываем результат
      if (result === "win") {
        state.wins++;
        const reward = 5 + state.round * 2;
        state.gold += reward;
        log.push({ text: `💰 Награда: +${reward} золота`, cls: "effect" });
        renderBattleLog(log);
        notify(`Победа! +${reward}💰`, "success");
      } else {
        state.losses++;
        state.hp = Math.max(1, Math.floor(state.hp * 0.5));
        notify("Поражение... но ты выжил", "error");
      }

      state.round++;
      state.maxHp += 5;
      state.hp = state.maxHp;
      generateShop();

      $("battleCloseBtn").disabled = false;
    }
  }, dt * 1000);

  // Первый лог
  log.push({ text: "⚔️ Бой начался!", cls: "info" });
  if (me.weapons.length === 0) log.push({ text: "⚠️ У вас нет оружия — вы не можете атаковать!", cls: "lose" });
  renderBattleLog(log);

  $("battleCloseBtn").onclick = () => {
    overlay.classList.remove("show");
    renderBackpack();
    renderShop();
    updateHUD();
    saveState();
    $("roundStatus").innerHTML = `Раунд <b>${state.round}</b> — собери рюкзак и нажми <b>«В бой!»</b>`;
  };
}

function renderFighters(me, enemy) {
  const renderFighter = (f, isMe) => {
    const hpPct = Math.max(0, f.hp / f.maxHp * 100);
    return `
      <h3>${isMe ? "🟢" : "🔴"} ${escapeHtml(f.name)}</h3>
      <div class="hp-bar ${isMe ? '' : 'enemy'}">
        <div class="fill" style="width:${hpPct}%"></div>
        <div class="text">${Math.max(0, Math.floor(f.hp))} / ${f.maxHp}</div>
      </div>
      <div class="fighter-stats">
        <span>🛡️ ${f.armor}</span>
        <span>⚔️ ${f.weapons.length}</span>
        <span>🧪 ${f.potions.length}</span>
        ${f.critChance > 0 ? `<span>💥 ${Math.round(f.critChance*100)}%</span>` : ""}
        ${f.lifesteal > 0 ? `<span>🩸 ${Math.round(f.lifesteal*100)}%</span>` : ""}
      </div>
      <div style="margin-top:8px;font-size:11px;color:#666;line-height:1.6;">
        ${f.weapons.map(w => `${w.emoji} ${w.damage}⚔️ / ${w.cooldown.toFixed(1)}с`).join("<br>") || "нет оружия"}
      </div>
    `;
  };

  $("fighterMe").innerHTML = renderFighter(me, true);
  $("fighterEnemy").innerHTML = renderFighter(enemy, false);
}

function renderBattleLog(log) {
  const box = $("battleLog");
  box.innerHTML = log.map(l => `<div class="log-line ${l.cls}">${escapeHtml(l.text)}</div>`).join("");
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============================================================
// СОХРАНЕНИЕ И ОНЛАЙН
// ============================================================
function saveState() {
  if (!playerRef) return;
  playerRef.update({
    hp: state.hp,
    maxHp: state.maxHp,
    gold: state.gold,
    round: state.round,
    wins: state.wins,
    losses: state.losses,
    backpack: state.backpack,
    lastSeen: firebase.database.ServerValue.TIMESTAMP
  });
}

function listenOpponents() {
  db.ref("players").on("value", snap => {
    const data = snap.val() || {};
    opponentsCache = data;

    const box = $("opponentsList");
    const arr = Object.entries(data).filter(([id]) => id !== state.playerId);

    if (arr.length === 0) {
      box.innerHTML = `<div style="color:#666;font-size:12px;">Пока никого нет онлайн.<br>Будешь сражаться с ботами.</div>`;
    } else {
      box.innerHTML = arr.map(([id, p]) => `
        <div class="player-row" style="padding:10px;background:#1a1a26;border-radius:8px;margin-bottom:6px;">
          <div style="flex:1;">
            <div style="font-weight:bold;color:#b48cff;">${escapeHtml(p.name)}</div>
            <div style="font-size:11px;color:#888;">Раунд ${p.round || 1} · ${p.wins || 0} побед</div>
          </div>
          <div style="font-size:12px;color:#6aff8c;">${p.hp || 100}❤️</div>
        </div>
      `).join("");
    }

    const loginList = $("onlineBox");
    if (loginList) {
      loginList.innerHTML = Object.keys(data).length
        ? `<div style="text-align:center;color:#888;margin-bottom:8px;">Онлайн: ${Object.keys(data).length}</div>` +
          Object.values(data).map(p => `<div class="online-item"><span class="name">${escapeHtml(p.name)}</span><span class="status">● ${p.round || 1} раунд</span></div>`).join("")
        : "Сейчас никто не играет";
    }
  });
}

function listenGlobalEvents() {
  db.ref("events").limitToLast(10).on("child_added", snap => {
    const ev = snap.val();
    if (!ev || ev.from === state.playerId) return;
    if (Date.now() - ev.time < 15000) {
      // показывать можно, но не обязательно
    }
  });
}

$("leaveBtn").onclick = async () => {
  if (playerRef) await playerRef.remove();
  location.reload();
};
</script>
