<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backpack Brawl — Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a14;--bg2:#12121f;--panel:rgba(20,20,35,0.7);
  --border:rgba(120,100,200,0.15);--border2:rgba(140,120,220,0.3);
  --text:#e8e4f5;--muted:#8a84a8;--dim:#4a4660;
  --gold:#ffc857;--gold2:#ffd87a;--purple:#a78bfa;--purple2:#c4b5fd;
  --green:#4ade80;--green2:#6ee7a0;--red:#f87171;--red2:#fca5a5;
  --blue:#60a5fa;--orange:#fb923c;--pink:#f472b6;
  --r1:#9ca3af;--r2:#4ade80;--r3:#60a5fa;--r4:#a78bfa;--r5:#ffc857;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;position:relative;font-size:14px}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 60% 40% at 20% -10%,rgba(167,139,250,0.15),transparent 60%),
    radial-gradient(ellipse 50% 40% at 90% 110%,rgba(96,165,250,0.12),transparent 60%),
    radial-gradient(ellipse 40% 30% at 50% 50%,rgba(244,114,182,0.05),transparent 70%),
    linear-gradient(180deg,#0a0a14 0%,#0d0a18 100%);
  z-index:-2;
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;
  background-image:
    radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,0.4),transparent),
    radial-gradient(1px 1px at 80% 10%,rgba(255,255,255,0.3),transparent),
    radial-gradient(1px 1px at 40% 70%,rgba(255,255,255,0.35),transparent),
    radial-gradient(1px 1px at 70% 50%,rgba(255,255,255,0.25),transparent),
    radial-gradient(1px 1px at 10% 80%,rgba(255,255,255,0.3),transparent),
    radial-gradient(1px 1px at 90% 90%,rgba(255,255,255,0.4),transparent);
  background-size:200px 200px,300px 300px,250px 250px,180px 180px,220px 220px,280px 280px;
  animation:drift 60s linear infinite;
}
@keyframes drift{to{background-position:200px 400px,-300px 600px,250px 500px,180px 360px,-220px 440px,280px 560px}}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(167,139,250,0.2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(167,139,250,0.4)}

.screen{display:none;height:100vh;overflow-y:auto}
.screen.active{display:block}

/* ЛОГИН */
#loginScreen{display:none;padding:40px 20px}
#loginScreen.active{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:24px}
.hero-logo{text-align:center}
.hero-logo h1{
  font-family:'Cinzel',serif;font-weight:900;font-size:clamp(36px,6vw,64px);
  background:linear-gradient(135deg,#fff 0%,var(--gold2) 30%,var(--purple2) 60%,#fff 100%);
  background-size:200% 200%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:2px;line-height:1;animation:shine 6s ease infinite;filter:drop-shadow(0 0 30px rgba(255,200,87,0.4));
}
@keyframes shine{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.hero-logo .sub{color:var(--muted);font-size:14px;letter-spacing:4px;text-transform:uppercase;margin-top:8px;font-weight:600}

.glass{
  background:var(--panel);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid var(--border);border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.08),0 0 0 1px rgba(167,139,250,0.05);
}
.login-panel{width:min(620px,95vw);padding:32px}
.login-panel label{display:block;color:var(--muted);font-size:11px;margin-bottom:8px;text-transform:uppercase;letter-spacing:2px;font-weight:700}
.login-panel input{
  width:100%;padding:14px 18px;background:rgba(10,10,20,0.8);border:1px solid var(--border2);
  color:var(--text);border-radius:12px;font-size:15px;font-weight:500;transition:all 0.2s;font-family:inherit;
}
.login-panel input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 4px rgba(167,139,250,0.15),0 0 30px rgba(167,139,250,0.2)}
.field{margin-bottom:20px}

.char-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}
@media(max-width:600px){.char-grid{grid-template-columns:repeat(2,1fr)}}
.char-card{
  padding:16px 12px;background:rgba(15,15,28,0.8);border:2px solid var(--border);
  border-radius:16px;cursor:pointer;text-align:center;transition:all 0.25s;position:relative;overflow:hidden;
}
.char-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,var(--acc,transparent) 0%,transparent 70%);
  opacity:0;transition:opacity 0.3s;
}
.char-card:hover{border-color:var(--acc,var(--purple));transform:translateY(-4px)}
.char-card:hover::before{opacity:0.2}
.char-card.selected{
  border-color:var(--acc,var(--gold));
  box-shadow:0 0 0 4px rgba(255,200,87,0.15),0 20px 40px rgba(0,0,0,0.4),0 0 40px var(--acc,var(--gold));
  transform:translateY(-4px) scale(1.02);
}
.char-card.selected::before{opacity:0.35}
.char-card .portrait{width:70px;height:70px;margin:0 auto 10px;display:block;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5))}
.char-card h4{font-size:14px;font-weight:800;margin-bottom:4px;color:var(--acc,var(--text))}
.char-card p{font-size:10px;color:var(--muted);line-height:1.4;min-height:28px}
.char-card .stats-mini{display:flex;justify-content:center;gap:6px;margin-top:8px;font-size:10px;font-weight:700;color:var(--muted)}
.char-card .stats-mini span{color:var(--text)}

.btn{padding:14px 24px;border-radius:12px;border:none;font-weight:800;font-size:14px;cursor:pointer;transition:all 0.2s;font-family:inherit;letter-spacing:0.5px;position:relative;overflow:hidden}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,0.2) 50%,transparent 70%);transform:translateX(-100%);transition:transform 0.6s}
.btn:hover:not(:disabled)::before{transform:translateX(100%)}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-primary{width:100%;background:linear-gradient(135deg,#8b5cf6,#c4b5fd);color:#fff;box-shadow:0 10px 30px rgba(139,92,246,0.4),inset 0 1px 0 rgba(255,255,255,0.3)}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 15px 40px rgba(139,92,246,0.5)}
.btn-gold{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#1a1206;box-shadow:0 10px 30px rgba(245,158,11,0.3),inset 0 1px 0 rgba(255,255,255,0.3)}
.btn-gold:hover:not(:disabled){transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{background:rgba(255,255,255,0.1);color:var(--text)}

/* ИГРА */
#gameScreen{padding:12px;height:100vh;display:none}
#gameScreen.active{display:flex;flex-direction:column;gap:12px;max-width:1600px;margin:0 auto}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;flex-wrap:wrap;gap:12px}
.hud{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.hud-item{display:flex;align-items:center;gap:10px}
.hud-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(0,0,0,0.4);border:1px solid var(--border)}
.hud-info .h-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
.hud-info .h-val{font-size:18px;font-weight:900;font-family:'Cinzel',serif;letter-spacing:0.5px}
.h-val.hp{color:var(--green2)}
.h-val.gold{color:var(--gold2)}
.h-val.round{color:var(--purple2)}
.h-val.wins{color:var(--blue)}

.game-grid{flex:1;display:grid;grid-template-columns:auto 1fr 320px;gap:12px;min-height:0}
@media(max-width:1200px){.game-grid{grid-template-columns:1fr;grid-template-rows:auto auto auto}}
.panel{padding:16px;overflow:auto;position:relative}
.panel-title{font-family:'Cinzel',serif;font-weight:800;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold2);margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.panel-title::before{content:'';position:absolute;left:16px;right:16px;height:1px;background:linear-gradient(90deg,transparent,var(--border2) 20%,var(--border2) 80%,transparent);margin-top:28px}
.panel-title span{background:var(--bg2);padding:0 10px;position:relative;z-index:1}

/* РЮКЗАК */
.bp-wrap{position:relative;margin:0 auto}
.bp-grid{display:grid;grid-template-columns:repeat(6,62px);grid-template-rows:repeat(5,62px);gap:5px;padding:12px;background:rgba(0,0,0,0.35);border-radius:16px;position:relative;border:1px solid var(--border)}
.bp-cell{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:8px;transition:all 0.15s}
.bp-cell.hl-ok{background:rgba(74,222,128,0.15);border-color:var(--green);box-shadow:0 0 12px rgba(74,222,128,0.3) inset}
.bp-cell.hl-merge{background:rgba(255,200,87,0.2);border-color:var(--gold);box-shadow:0 0 20px rgba(255,200,87,0.4) inset;animation:pulseMerge 1s infinite}
@keyframes pulseMerge{0%,100%{box-shadow:0 0 20px rgba(255,200,87,0.4) inset}50%{box-shadow:0 0 30px rgba(255,200,87,0.7) inset}}

.item{
  position:absolute;border-radius:10px;cursor:grab;user-select:none;
  display:flex;align-items:center;justify-content:center;
  transition:transform 0.15s,box-shadow 0.15s,filter 0.15s;
  border:2px solid;overflow:hidden;
}
.item img{width:100%;height:100%;display:block;pointer-events:none}
.item::before{
  content:'';position:absolute;inset:0;border-radius:8px;
  background:linear-gradient(180deg,rgba(255,255,255,0.15) 0%,transparent 40%,rgba(0,0,0,0.3) 100%);
  pointer-events:none;z-index:1;
}
.item::after{
  content:attr(data-tier);position:absolute;bottom:2px;right:4px;
  font-size:9px;font-weight:900;color:rgba(255,255,255,0.95);
  text-shadow:0 0 4px #000,0 0 8px #000;font-family:'Cinzel',serif;letter-spacing:0.5px;z-index:2;
}
.item:hover{transform:scale(1.08);z-index:50;filter:brightness(1.15);box-shadow:0 0 25px currentColor}
.item.dragging{opacity:0.35;cursor:grabbing}
.item[data-rar="1"]{border-color:var(--r1);color:var(--r1);box-shadow:0 0 8px rgba(156,163,175,0.2)}
.item[data-rar="2"]{border-color:var(--r2);color:var(--r2);box-shadow:0 0 12px rgba(74,222,128,0.35)}
.item[data-rar="3"]{border-color:var(--r3);color:var(--r3);box-shadow:0 0 15px rgba(96,165,250,0.45)}
.item[data-rar="4"]{border-color:var(--r4);color:var(--r4);box-shadow:0 0 20px rgba(167,139,250,0.55);animation:glow4 2.5s ease infinite}
.item[data-rar="5"]{border-color:var(--r5);color:var(--r5);box-shadow:0 0 25px rgba(255,200,87,0.7);animation:glow5 2s ease infinite}
@keyframes glow4{0%,100%{box-shadow:0 0 20px rgba(167,139,250,0.55)}50%{box-shadow:0 0 30px rgba(167,139,250,0.9)}}
@keyframes glow5{0%,100%{box-shadow:0 0 25px rgba(255,200,87,0.7)}50%{box-shadow:0 0 40px rgba(255,200,87,1)}}

/* МАГАЗИН */
.shop-list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 380px);overflow-y:auto;padding-right:6px}
.shop-item{display:flex;gap:12px;padding:12px;background:rgba(15,15,28,0.6);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:all 0.2s;align-items:center;position:relative;overflow:hidden}
.shop-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--r,var(--r1));box-shadow:0 0 12px var(--r,var(--r1))}
.shop-item:hover:not(.disabled){border-color:var(--r,var(--purple));transform:translateX(3px);background:rgba(25,25,45,0.8);box-shadow:0 5px 20px rgba(0,0,0,0.4),0 0 20px var(--r,transparent)}
.shop-item.disabled{opacity:0.4;cursor:not-allowed}
.si-icon{width:52px;height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);border:2px solid var(--r,var(--r1));flex-shrink:0;position:relative;overflow:hidden}
.si-icon img{width:100%;height:100%}
.si-icon .si-tier{position:absolute;bottom:-2px;right:-2px;background:var(--bg);border:1px solid var(--r,var(--r1));color:var(--r,var(--r1));font-size:9px;font-weight:900;padding:1px 4px;border-radius:4px;font-family:'Cinzel',serif;z-index:3}
.si-info{flex:1;min-width:0}
.si-name{font-size:13px;font-weight:800;color:var(--r,var(--text));margin-bottom:3px}
.si-desc{font-size:11px;color:var(--muted);line-height:1.4}
.si-price{font-family:'Cinzel',serif;font-weight:900;color:var(--gold2);font-size:14px;white-space:nowrap;flex-shrink:0}

.item-info{margin-top:12px;padding:14px;min-height:120px;background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:12px;font-size:12px;color:var(--muted);line-height:1.5}
.ii-head{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.ii-head img{width:52px;height:52px}
.ii-name{font-size:15px;font-weight:800;font-family:'Cinzel',serif;letter-spacing:0.5px}
.ii-desc{margin-bottom:8px;color:var(--text);font-size:12px;margin-top:6px}
.ii-stats{color:var(--green2);font-family:'Consolas',monospace;line-height:1.7;font-size:11px}
.ii-merge{margin-top:10px;padding:8px 10px;background:rgba(255,200,87,0.1);border:1px dashed var(--gold);border-radius:8px;color:var(--gold2);font-size:11px}

/* ОНЛАЙН */
.player-row{display:flex;gap:10px;padding:10px;background:rgba(15,15,28,0.6);border-radius:10px;margin-bottom:8px;border:1px solid var(--border);align-items:center}
.pr-avatar{width:40px;height:40px;border-radius:10px;background:rgba(0,0,0,0.4);flex-shrink:0;overflow:hidden}
.pr-avatar img{width:100%;height:100%}
.pr-name{font-size:12px;font-weight:800;color:var(--purple2)}
.pr-sub{font-size:10px;color:var(--muted);margin-top:2px}
.pr-hp{font-size:11px;color:var(--green2);font-weight:700;font-family:'Cinzel',serif}

/* БОЙ */
.overlay{position:fixed;inset:0;background:rgba(5,4,2,0.92);backdrop-filter:blur(12px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
.overlay.show{display:flex;animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.battle-modal{
  width:100%;max-width:1100px;padding:28px;
  background:linear-gradient(180deg,rgba(25,20,40,0.95),rgba(15,10,25,0.98));
  border:2px solid var(--purple);border-radius:24px;
  box-shadow:0 40px 100px rgba(0,0,0,0.8),0 0 80px rgba(167,139,250,0.3),inset 0 1px 0 rgba(255,255,255,0.1);
  max-height:92vh;overflow-y:auto;
}
.battle-title{
  font-family:'Cinzel',serif;text-align:center;font-size:28px;font-weight:900;
  background:linear-gradient(135deg,var(--gold2),#fff,var(--gold2));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:3px;margin-bottom:4px;filter:drop-shadow(0 0 20px rgba(255,200,87,0.5));
}
.battle-sub{text-align:center;color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:20px}
.arena{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:start;margin-bottom:16px}
@media(max-width:800px){.arena{grid-template-columns:1fr;gap:8px}.vs{transform:rotate(90deg);padding:0 !important}}
.fighter{padding:16px;border-radius:16px;background:rgba(0,0,0,0.4);border:2px solid var(--border);transition:all 0.3s}
.fighter.me{border-color:var(--green);box-shadow:0 0 30px rgba(74,222,128,0.2)}
.fighter.enemy{border-color:var(--red);box-shadow:0 0 30px rgba(248,113,113,0.2)}
.fighter.shake{animation:shake 0.3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fighter-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.fighter-head .portrait{width:56px;height:56px;border-radius:12px;background:rgba(0,0,0,0.3);border:2px solid currentColor;padding:4px}
.fighter.me .fighter-head .portrait{border-color:var(--green)}
.fighter.enemy .fighter-head .portrait{border-color:var(--red)}
.fighter-name{font-family:'Cinzel',serif;font-weight:900;font-size:16px;letter-spacing:1px}
.fighter.me .fighter-name{color:var(--green2)}
.fighter.enemy .fighter-name{color:var(--red2)}
.fighter-role{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}

.hp-bar{height:22px;background:rgba(0,0,0,0.6);border-radius:11px;overflow:hidden;position:relative;margin-bottom:12px;border:1px solid rgba(255,255,255,0.1)}
.hp-bar .fill{height:100%;transition:width 0.3s ease;background:linear-gradient(90deg,#22c55e,#4ade80,#86efac);box-shadow:0 0 20px rgba(74,222,128,0.5);position:relative;overflow:hidden}
.hp-bar.enemy .fill{background:linear-gradient(90deg,#dc2626,#f87171,#fca5a5);box-shadow:0 0 20px rgba(248,113,113,0.5)}
.hp-bar .fill::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.35),transparent 50%)}
.hp-bar .text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;font-family:'Cinzel',serif;text-shadow:0 0 6px #000;letter-spacing:1px}

.stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;font-size:11px;font-family:'Consolas',monospace}
.stat-pill{padding:4px 8px;background:rgba(255,255,255,0.05);border-radius:6px;display:flex;justify-content:space-between}
.stat-pill span:first-child{color:var(--muted)}
.stat-pill span:last-child{color:var(--text);font-weight:700}

.vs{font-family:'Cinzel',serif;font-size:36px;font-weight:900;color:var(--purple2);text-shadow:0 0 30px rgba(167,139,250,0.8);padding:20px;letter-spacing:3px;animation:pulseVs 2s ease infinite}
@keyframes pulseVs{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

.battle-log{padding:14px;background:rgba(0,0,0,0.5);border-radius:12px;max-height:220px;overflow-y:auto;font-family:'Consolas',monospace;font-size:12px;line-height:1.8;border:1px solid var(--border)}
.log-line{padding:2px 0;animation:logIn 0.3s}
@keyframes logIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.log-dmg{color:var(--red2)}
.log-heal{color:var(--green2)}
.log-eff{color:var(--gold2)}
.log-info{color:var(--blue)}
.log-win{color:var(--gold2);font-weight:900;font-size:15px;text-align:center;padding:6px 0;text-shadow:0 0 12px currentColor}
.log-lose{color:var(--red);font-weight:900;font-size:15px;text-align:center;padding:6px 0;text-shadow:0 0 12px currentColor}

.float-dmg{position:fixed;font-family:'Cinzel',serif;font-weight:900;font-size:24px;color:var(--red);text-shadow:0 0 12px currentColor,0 2px 4px #000;pointer-events:none;z-index:9999;animation:floatUp 1s forwards}
@keyframes floatUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-60px);opacity:0}}

#notify{position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:10px;max-width:340px}
.notify{padding:14px 20px;background:rgba(20,20,35,0.95);backdrop-filter:blur(20px);border-left:4px solid var(--purple);border-radius:12px;color:var(--text);font-size:13px;font-weight:600;box-shadow:0 10px 40px rgba(0,0,0,0.6);animation:slideIn 0.35s cubic-bezier(0.34,1.56,0.64,1)}
.notify.success{border-color:var(--green)}
.notify.error{border-color:var(--red)}
.notify.info{border-color:var(--blue)}
.notify.gold{border-color:var(--gold)}
@keyframes slideIn{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}

.round-banner{padding:14px 20px;text-align:center;background:linear-gradient(90deg,transparent,rgba(167,139,250,0.15),transparent);border-top:1px solid var(--border2);border-bottom:1px solid var(--border2);font-size:13px;color:var(--purple2);font-weight:600;letter-spacing:1px}
.round-banner b{color:var(--gold2);font-family:'Cinzel',serif}

<body>

<div id="loginScreen" class="screen active">
  <div class="hero-logo">
    <h1>BACKPACK BRAWL</h1>
    <div class="sub">Собери · Объедини · Победи</div>
  </div>

  <div class="glass login-panel">
    <div class="field">
      <label>Имя героя</label>
      <input type="text" id="playerName" maxlength="16" placeholder="Введи имя..." autocomplete="off">
    </div>

    <div class="field">
      <label>Выбери персонажа</label>
      <div class="char-grid" id="charGrid"></div>
    </div>

    <button id="enterBtn" class="btn btn-primary">⚔️ Войти в бой</button>

    <div id="onlineBox" style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border);color:var(--muted);font-size:12px;text-align:center;">
      Загрузка...
    </div>
  </div>
</div>

<div id="gameScreen" class="screen">
  <div class="glass top-bar">
    <div class="hud">
      <div class="hud-item">
        <div class="hud-icon" style="color:var(--green2);font-weight:900;">HP</div>
        <div class="hud-info">
          <div class="h-label">Здоровье</div>
          <div class="h-val hp" id="hudHp">100</div>
        </div>
      </div>
      <div class="hud-item">
        <div class="hud-icon" style="color:var(--gold2);font-weight:900;">💰</div>
        <div class="hud-info">
          <div class="h-label">Золото</div>
          <div class="h-val gold" id="hudGold">10</div>
        </div>
      </div>
      <div class="hud-item">
        <div class="hud-icon" style="color:var(--purple2);font-weight:900;">№</div>
        <div class="hud-info">
          <div class="h-label">Раунд</div>
          <div class="h-val round" id="hudRound">1</div>
        </div>
      </div>
      <div class="hud-item">
        <div class="hud-icon" style="color:var(--blue);font-weight:900;">★</div>
        <div class="hud-info">
          <div class="h-label">Победы</div>
          <div class="h-val wins" id="hudWins">0/0</div>
        </div>
      </div>
    </div>
    <button class="btn btn-ghost" id="leaveBtn">Выйти</button>
  </div>

  <div class="round-banner" id="roundBanner">
    Раунд <b>1</b> · Собирай рюкзак · <b>Объединяй</b> предметы перетаскивая друг на друга
  </div>

  <div class="game-grid">
    <div class="glass panel">
      <div class="panel-title"><span>🎒 Рюкзак</span></div>
      <div class="bp-wrap">
        <div class="bp-grid" id="backpack"></div>
      </div>
      <div class="item-info" id="itemInfo">
        <div style="color:var(--dim);text-align:center;padding:20px 0;">Наведи курсор на предмет — увидишь характеристики</div>
      </div>
    </div>

    <div class="glass panel">
      <div class="panel-title"><span>🛒 Магазин</span></div>
      <div class="shop-list" id="shopList"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn btn-gold" id="battleBtn" style="flex:2;">⚔️ В бой!</button>
        <button class="btn btn-ghost" id="rerollBtn" style="flex:1;">🔄 2💰</button>
      </div>
    </div>

    <div class="glass panel">
      <div class="panel-title"><span>👥 Онлайн</span></div>
      <div id="opponentsList"><div style="color:var(--dim);text-align:center;padding:20px;font-size:12px;">Загрузка...</div></div>
    </div>
  </div>
</div>

<div id="battleOverlay" class="overlay">
  <div class="battle-modal">
    <div class="battle-title" id="battleTitle">⚔️ БОЙ</div>
    <div class="battle-sub" id="battleSub">Раунд 1</div>
    <div class="arena">
      <div class="fighter me" id="fighterMe"></div>
      <div class="vs">VS</div>
      <div class="fighter enemy" id="fighterEnemy"></div>
    </div>
    <div class="battle-log" id="battleLog"></div>
    <div style="margin-top:16px;text-align:center;">
      <button class="btn btn-primary" id="battleCloseBtn" disabled style="width:auto;padding:12px 40px;">Продолжить</button>
    </div>
  </div>
</div>

<div id="notify"></div>

<script>

// ============================================================
// SVG ИКОНКИ ПРЕДМЕТОВ (все рисуются кодом, работают везде)
// ============================================================
const TIER_PALETTE = [
  { c1:"#e2e8f0", c2:"#94a3b8", c3:"#475569", glow:"#cbd5e1", bg1:"#2a2a35", bg2:"#14141c" },
  { c1:"#a7f3d0", c2:"#34d399", c3:"#065f46", glow:"#6ee7b7", bg1:"#1a2e28", bg2:"#0a1512" },

  { c1:"#fef3c7", c2:"#fbbf24", c3:"#b45309", glow:"#fde68a", bg1:"#352a15", bg2:"#1c1405" }
];

function svgWrap(inner, tier, shape) {
  const t = TIER_PALETTE[tier-1];
  const id = Math.random().toString(36).slice(2,8);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
      <radialGradient id="bg${id}" cx="50%" cy="40%">
        <stop offset="0%" stop-color="${t.bg1}"/>
        <stop offset="100%" stop-color="${t.bg2}"/>
      </radialGradient>
      <linearGradient id="m${id}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="${t.c1}"/>
        <stop offset="50%" stop-color="${t.c2}"/>
        <stop offset="100%" stop-color="${t.c3}"/>
      </linearGradient>
      <linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${t.c1}"/>
        <stop offset="100%" stop-color="${t.c2}"/>
      </linearGradient>
      <filter id="gl${id}">
        <feGaussianBlur stdDeviation="1.5"/>
      </filter>
    </defs>
    <rect width="64" height="64" rx="10" fill="url(#bg${id})"/>
    <circle cx="32" cy="30" r="22" fill="${t.glow}" opacity="0.08" filter="url(#gl${id})"/>
    ${shape(id, t)}
  </svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

// Мага возвращает SVG-строку для конкретного типа предмета
function shapeSword(id, t) {
  return `

    <circle cx="32" cy="59" r="3" fill="url(#g${id})" stroke="${t.c3}" stroke-width="0.5"/>
  `;
}

  return `

    <rect x="30" y="43" width="4" height="12" fill="${t.c3}"/>
    <circle cx="32" cy="57" r="2.5" fill="url(#g${id})"/>

}
function shapeBow(id, t) {
  return `
    <path d="M18 10 Q52 32 18 54" fill="none" stroke="url(#m${id})" stroke-width="5" stroke-linecap="round"/>

    <line x1="18" y1="10" x2="18" y2="54" stroke="${t.c3}" stroke-width="1"/>
    <line x1="14" y1="32" x2="46" y2="32" stroke="${t.c1}" stroke-width="2"/>
    <path d="M46 32 L40 29 L40 35 Z" fill="${t.c2}"/>
    <path d="M14 32 L20 29 L20 35 Z" fill="${t.c3}"/>
  `;
}
function shapeStaff(id, t) {
  return `
    <rect x="30" y="20" width="4" height="40" fill="${t.c3}" rx="2"/>
    <rect x="30" y="20" width="2" height="40" fill="${t.c2}" opacity="0.5" rx="1"/>
    <circle cx="32" cy="16" r="10" fill="url(#g${id})" opacity="0.9"/>

    <circle cx="30" cy="13" r="2" fill="#fff" opacity="0.9"/>
    <circle cx="32" cy="16" r="14" fill="none" stroke="${t.glow}" stroke-width="0.8" opacity="0.5"/>
  `;
}
function shapeAxe(id, t) {
  return `
    <rect x="30" y="14" width="4" height="46" fill="${t.c3}" rx="2"/>
    <path d="M30 14 Q20 12 16 22 Q14 32 22 38 L30 34 Z" fill="url(#m${id})" stroke="${t.c3}" stroke-width="1"/>
    <path d="M30 14 Q40 12 44 22 Q46 32 38 38 L30 34 Z" fill="url(#m${id})" stroke="${t.c3}" stroke-width="1"/>

function shapeHeavyArmor(id, t) {
  return `
    <path d="M14 18 Q14 14 18 14 L26 14 L32 20 L38 14 L46 14 Q50 14 50 18 L50 32 L46 36 L46 52 Q46 54 44 54 L20 54 Q18 54 18 52 L18 36 L14 32 Z" fill="url(#m${id})" stroke="${t.c3}" stroke-width="1"/>

function shapePotion(id, t) {
  return `

    <circle cx="32" cy="38" r="14" fill="none" stroke="${t.c1}" stroke-width="1.5" opacity="0.6"/>
    <path d="M22 26 L32 14 L42 26 L32 34 Z" fill="url(#g${id})" stroke="${t.c3}" stroke-width="1"/>
    <path d="M24 26 L32 18 L40 26 L32 30 Z" fill="${t.c1}" opacity="0.7"/>
    <circle cx="28" cy="22" r="2" fill="#fff" opacity="0.9"/>
    <circle cx="36" cy="40" r="2" fill="${t.c1}" opacity="0.5"/>

const SHAPE_FN = {
  sword: shapeSword,
  dagger: shapeDagger,
  bow: shapeBow,
  staff: shapeStaff,
  axe: shapeAxe,
  mace: shapeMace,
  heavy_armor: shapeHeavyArmor,
  light_armor: shapeLightArmor,
  potion: shapePotion,
  ring: shapeRing
};

function makeItemIcon(chain, tier) {
  const fn = SHAPE_FN[chain] || shapeSword;
  return svgWrap(null, tier, fn);
}

  } else if (key === "wizard") {

    // Капюшон
    face = `

function notify(text,type="info",dur=3000){
  const box = $("notify");
  const el = document.createElement("div");
  el.className = "notify "+type;
  el.textContent = text;
  box.appendChild(el);
  setTimeout(()=>{
    el.style.transition = "opacity 0.3s, transform 0.3s";
    el.style.opacity = "0";
    el.style.transform = "translateX(400px)";
    setTimeout(()=>el.remove(),300);
  },dur);
}

$("enterBtn").onclick = async ()=>{
  const name = $("playerName").value.trim();
  if(!name) return notify("Введи имя!","error");
  if(!state.charKey) return notify("Выбери персонажа!","error");

  const ch = CHARACTERS[state.charKey];
  state.playerId = "p_"+Date.now()+"_"+Math.floor(Math.random()*10000);
  state.name = name;
  state.baseHp = ch.hp;
  state.maxHp = ch.hp;
  state.hp = ch.hp;
  state.gold = ch.gold;
  state.round = 1;
  state.wins = 0;
  state.losses = 0;
  state.backpack = [];

  ch.startItems.forEach(it=>{ addItem(it.itemKey, it.x, it.y); });
  generateShop();

  playerRef = db.ref("players/"+state.playerId);
  await playerRef.set({
    name: state.name, charKey: state.charKey,
    hp: state.hp, maxHp: state.maxHp,
    gold: state.gold, round: state.round,
    wins: state.wins, losses: state.losses,
    backpack: state.backpack,
    lastSeen: firebase.database.ServerValue.TIMESTAMP
  });
  playerRef.onDisconnect().remove();

  $("loginScreen").classList.remove("active");
  $("gameScreen").classList.add("active");

  renderBackpack();
  renderShop();
  updateHUD();
  listenOpponents();

  notify("Добро пожаловать, "+name+"!","success");
};

// ============================================================
function addItem(itemKey,x,y){
  const item = ITEMS[itemKey];
  if(!item) return false;
  if(!canPlace(itemKey,x,y,null)) return false;
  state.backpack.push({itemKey,x,y,uid:++uidCounter});
  return true;
}

function canPlace(itemKey,x,y,ignoreUid){
  const item = ITEMS[itemKey];
  if(!item) return false;
  const [w,h] = item.size;
  if(x<0||y<0||x+w>GW||y+h>GH) return false;
  for(const p of state.backpack){
    if(p.uid===ignoreUid) continue;
    const it = ITEMS[p.itemKey];
    const [pw,ph] = it.size;
    if(x<p.x+pw && x+w>p.x && y<p.y+ph && y+h>p.y) return false;
  }
  return true;
}
const GW=6, GH=5;
const CELL=62, GAP=5, PAD=12;

function findItemAt(x,y,ignoreUid){
  for(const p of state.backpack){
    if(p.uid===ignoreUid) continue;
    const it = ITEMS[p.itemKey];
    const [w,h] = it.size;
    if(x>=p.x && x<p.x+w && y>=p.y && y<p.y+h) return p;
  }
  return null;
}

function renderBackpack(){
  const grid = $("backpack");
  grid.innerHTML = "";
  grid.style.position = "relative";

  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      const c = document.createElement("div");
      c.className = "bp-cell";
      c.dataset.x = x; c.dataset.y = y;
      grid.appendChild(c);
    }
  }

  state.backpack.forEach(p=>{
    const it = ITEMS[p.itemKey];
    const [w,h] = it.size;
    const el = document.createElement("div");
    el.className = "item";
    el.dataset.uid = p.uid;
    el.dataset.rar = it.tier;
    el.dataset.tier = "T"+it.tier;
    el.style.left = (PAD + p.x*(CELL+GAP)) + "px";
    el.style.top  = (PAD + p.y*(CELL+GAP)) + "px";
    el.style.width = (w*CELL + (w-1)*GAP) + "px";
    el.style.height = (h*CELL + (h-1)*GAP) + "px";
    el.title = it.name;
    const img = document.createElement("img");
    img.src = ITEM_ICONS[p.itemKey];
    img.alt = it.name;
    el.appendChild(img);

    el.addEventListener("mouseenter",()=>showItemInfo(p.itemKey));
    el.addEventListener("mouseleave",hideItemInfo);
    el.addEventListener("mousedown",(e)=>startDrag(e,p));

    grid.appendChild(el);
  });
}

function showItemInfo(key){
  const it = ITEMS[key];
  const rar = ["#9ca3af","#4ade80","#60a5fa","#a78bfa","#ffc857"][it.tier-1];
  const rarNames = ["Обычный","Необычный","Редкий","Эпический","Легендарный"];
  const stats = [];
  if(it.dmg) stats.push(`Урон: ${it.dmg}`);
  if(it.cd) stats.push(`Кулдаун: ${it.cd}с`);
  if(it.armor) stats.push(`Броня: ${it.armor}`);
  if(it.hpBonus) stats.push(`+${it.hpBonus} HP`);
  if(it.heal) stats.push(`Лечение: +${it.heal}`);
  if(it.atkBonus) stats.push(`+${it.atkBonus} к урону`);
  if(it.crit) stats.push(`Крит: +${Math.round(it.crit*100)}%`);
  if(it.lifesteal) stats.push(`Вампиризм: ${Math.round(it.lifesteal*100)}%`);
  if(it.thorn) stats.push(`Шипы: ${it.thorn}`);
  if(it.stun) stats.push(`Оглушение: ${it.stun}с`);
  if(it.magicBonus) stats.push(`Магия: +${Math.round(it.magicBonus*100)}%`);
  if(it.magic) stats.push(`Игнорирует броню`);

  const mergeInfo = it.next
    ? `<div class="ii-merge">⚡ Соедините с другим «${it.name}» — получите <b>${ITEMS[it.next].name}</b></div>`
    : `<div class="ii-merge" style="opacity:0.5;">🌟 Максимальный уровень</div>`;

  $("itemInfo").innerHTML = `
    <div class="ii-head">
      <img src="${ITEM_ICONS[key]}" alt="">
      <div>
        <div class="ii-name" style="color:${rar}">${it.name}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:2px;">T${it.tier} · ${rarNames[it.tier-1]}</div>
      </div>
    </div>
    <div class="ii-desc">${it.desc}</div>
    <div class="ii-stats">${stats.join("<br>")}</div>
    ${mergeInfo}
  `;
}

function hideItemInfo(){
  $("itemInfo").innerHTML = `<div style="color:var(--dim);text-align:center;padding:20px 0;">Наведи курсор на предмет — увидишь характеристики</div>`;
}

// ============================================================
// DRAG & DROP
// ============================================================
function startDrag(e, placed){
  if(e.button !== 0) return;
  e.preventDefault();

  const it = ITEMS[placed.itemKey];
  const el = e.target.closest(".item");
  const rect = el.getBoundingClientRect();
  dragCtx = {
    placed, item:it, el,
    offX: e.clientX - rect.left,
    offY: e.clientY - rect.top
  };

  const ghost = el.cloneNode(true);
  ghost.id = "dragGhost";
  ghost.style.position = "fixed";
  ghost.style.pointerEvents = "none";
  ghost.style.zIndex = "9999";
  ghost.style.opacity = "0.9";
  ghost.style.transform = "scale(1.1) rotate(-3deg)";
  ghost.style.left = rect.left+"px";
  ghost.style.top = rect.top+"px";
  ghost.style.width = rect.width+"px";
  ghost.style.height = rect.height+"px";
  document.body.appendChild(ghost);

  el.classList.add("dragging");
  document.addEventListener("mousemove", onDragMove);
  document.addEventListener("mouseup", onDragEnd);
}

function onDragMove(e){
  if(!dragCtx) return;
  const ghost = $("dragGhost");
  if(!ghost) return;
  ghost.style.left = (e.clientX - dragCtx.offX)+"px";
  ghost.style.top = (e.clientY - dragCtx.offY)+"px";

  const grid = $("backpack");
  const gRect = grid.getBoundingClientRect();
  const cellX = Math.round((e.clientX - gRect.left - dragCtx.offX - PAD) / (CELL+GAP));
  const cellY = Math.round((e.clientY - gRect.top - dragCtx.offY - PAD) / (CELL+GAP));

  document.querySelectorAll(".bp-cell").forEach(c=>c.classList.remove("hl-ok","hl-merge"));

  const target = findItemAt(cellX, cellY, dragCtx.placed.uid);
  const isMerge = target && target.itemKey === dragCtx.placed.itemKey && ITEMS[target.itemKey].next;

  if(isMerge){
    const it = ITEMS[target.itemKey];
    const [w,h] = it.size;
    for(let y=target.y;y<target.y+h;y++){
      for(let x=target.x;x<target.x+w;x++){
        const c = document.querySelector(`.bp-cell[data-x="${x}"][data-y="${y}"]`);
        if(c) c.classList.add("hl-merge");
      }
    }
    return;
  }

  if(canPlace(dragCtx.placed.itemKey, cellX, cellY, dragCtx.placed.uid)){
    const it = dragCtx.item;
    const [w,h] = it.size;
    for(let y=cellY;y<cellY+h;y++){
      for(let x=cellX;x<cellX+w;x++){
        if(x<0||y<0||x>=GW||y>=GH) continue;
        const c = document.querySelector(`.bp-cell[data-x="${x}"][data-y="${y}"]`);
        if(c) c.classList.add("hl-ok");
      }
    }
  }
}

function onDragEnd(e){
  if(!dragCtx) return;
  const grid = $("backpack");
  const gRect = grid.getBoundingClientRect();

  const cellX = Math.round((e.clientX - gRect.left - dragCtx.offX - PAD) / (CELL+GAP));
  const cellY = Math.round((e.clientY - gRect.top - dragCtx.offY - PAD) / (CELL+GAP));

  const placed = dragCtx.placed;
  const target = findItemAt(cellX, cellY, placed.uid);

  const canMerge = target && target.itemKey === placed.itemKey && ITEMS[target.itemKey].next;

  if(canMerge){
    const nextKey = ITEMS[target.itemKey].next;
    const nextItem = ITEMS[nextKey];
    const keepX = target.x, keepY = target.y;
    state.backpack = state.backpack.filter(p=>p.uid!==placed.uid && p.uid!==target.uid);

    if(canPlace(nextKey, keepX, keepY, null)){
      state.backpack.push({itemKey:nextKey,x:keepX,y:keepY,uid:++uidCounter});
      notify(`⚡ Объединено: ${nextItem.name}!`,"gold",2500);
      spawnMergeFx(keepX, keepY, nextItem.tier);
    } else {
      const spot = findFreeSpot(nextKey);
      if(spot){
        state.backpack.push({itemKey:nextKey,x:spot.x,y:spot.y,uid:++uidCounter});
        notify(`⚡ Объединено: ${nextItem.name}!`,"gold",2500);
      } else {
        state.backpack.push({itemKey:target.itemKey,x:target.x,y:target.y,uid:++uidCounter});
        state.backpack.push({itemKey:placed.itemKey,x:placed.x,y:placed.y,uid:++uidCounter});
        notify("Нет места для объединения!","error");
      }
    }
    cleanupDrag();
    renderBackpack();
    saveState();
    return;
  }

  if(canPlace(placed.itemKey, cellX, cellY, placed.uid)){
    placed.x = cellX; placed.y = cellY;
  } else {
    let found = false;
    for(let r=1;r<=2 && !found;r++){
      for(let dy=-r;dy<=r && !found;dy++){
        for(let dx=-r;dx<=r && !found;dx++){
          if(canPlace(placed.itemKey, cellX+dx, cellY+dy, placed.uid)){
            placed.x = cellX+dx; placed.y = cellY+dy;
            found = true;
          }
        }
      }
    }
  }

  cleanupDrag();
  renderBackpack();
  saveState();
}

function cleanupDrag(){
  if(dragCtx?.el) dragCtx.el.classList.remove("dragging");
  const ghost = $("dragGhost");
  if(ghost) ghost.remove();
  document.querySelectorAll(".bp-cell").forEach(c=>c.classList.remove("hl-ok","hl-merge"));
  document.removeEventListener("mousemove", onDragMove);
  document.removeEventListener("mouseup", onDragEnd);
  dragCtx = null;
}

function spawnMergeFx(gx,gy,tier){
  const grid = $("backpack");
  const rect = grid.getBoundingClientRect();
  const fx = document.createElement("div");
  fx.style.cssText = `
    position:fixed;left:${rect.left + PAD + gx*(CELL+GAP)}px;
    top:${rect.top + PAD + gy*(CELL+GAP)}px;
    font-size:40px;pointer-events:none;z-index:9998;
    animation:floatUp 1.2s forwards;
    filter:drop-shadow(0 0 20px ${["#9ca3af","#4ade80","#60a5fa","#a78bfa","#ffc857"][tier-1]});
  `;
  fx.textContent = "✨";
  document.body.appendChild(fx);
  setTimeout(()=>fx.remove(),1200);
}

function findFreeSpot(itemKey){
  for(let y=0;y<GH;y++)
    for(let x=0;x<GW;x++)
      if(canPlace(itemKey,x,y,null)) return {x,y};
  return null;
}

document.addEventListener("contextmenu",(e)=>{
  const card = e.target.closest(".item");
  if(!card) return;
  e.preventDefault();
  const uid = +card.dataset.uid;
  const placed = state.backpack.find(p=>p.uid===uid);
  if(!placed) return;
  const it = ITEMS[placed.itemKey];
  const price = Math.floor(it.price*0.6);
  if(confirm(`Продать "${it.name}" за ${price}💰?`)){
    state.backpack = state.backpack.filter(p=>p.uid!==uid);
    state.gold += price;
    notify(`Продано: +${price}💰`,"gold");
    renderBackpack(); updateHUD(); saveState();
  }
});

function generateShop(){
  state.shop = [];
  for(let i=0;i<6;i++) state.shop.push(rollItem());
}

function rollItem(){
  const tierWeights = {1:45, 2:30, 3:15, 4:8, 5:2};
  const maxTier = Math.min(5, Math.max(1, Math.ceil(state.round/3)+1));
  const pool = Object.keys(ITEMS).filter(k=>ITEMS[k].tier<=maxTier);
  const weights = pool.map(k=>tierWeights[ITEMS[k].tier]||10);
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<pool.length;i++){
    r -= weights[i];
    if(r<=0) return pool[i];
  }
  return pool[0];
}

function renderShop(){
  const box = $("shopList");
  box.innerHTML = "";
  state.shop.forEach((key,idx)=>{
    const it = ITEMS[key];
    const rar = ["#9ca3af","#4ade80","#60a5fa","#a78bfa","#ffc857"][it.tier-1];
    const canAfford = state.gold >= it.price;
    const el = document.createElement("div");
    el.className = "shop-item" + (canAfford?"":" disabled");
    el.style.setProperty("--r",rar);
    el.innerHTML = `
      <div class="si-icon">
        <img src="${ITEM_ICONS[key]}" alt="">
        <span class="si-tier">T${it.tier}</span>
      </div>
      <div class="si-info">
        <div class="si-name">${it.name}</div>
        <div class="si-desc">${it.desc}</div>
      </div>
      <div class="si-price">${it.price}💰</div>
    `;
    el.onclick = ()=>buyItem(idx);
    box.appendChild(el);
  });
}

function buyItem(idx){
  const key = state.shop[idx];
  const it = ITEMS[key];
  if(state.gold < it.price) return notify("Не хватает золота!","error");
  const spot = findFreeSpot(key);
  if(!spot) return notify("В рюкзаке нет места!","error");
  state.gold -= it.price;
  addItem(key, spot.x, spot.y);
  state.shop.splice(idx,1);
  notify(`Куплено: ${it.name}`,"success",1500);
  renderBackpack(); renderShop(); updateHUD(); saveState();
}

$("rerollBtn").onclick = ()=>{
  if(state.gold < 2) return notify("Нужно 2 золота!","error");
  state.gold -= 2;
  generateShop(); renderShop(); updateHUD(); saveState();
};

$("battleBtn").onclick = startBattle;

function buildFighter(name, backpack, baseHp, isMe, charKey){
  const f = {
    name, hp:baseHp, maxHp:baseHp, baseHp,
    armor:0, atkBonus:0, hpBonus:0,
    critChance:0, lifesteal:0, thorn:0,
    magicBonus:0, weapons:[], potions:[],
    portrait: PORTRAITS[charKey] || PORTRAITS.knight,
    charKey: charKey, color: (CHARACTERS[charKey]||CHARACTERS.knight).color, isMe
  };

  for(const p of backpack){
    const it = ITEMS[p.itemKey];
    if(!it) continue;
    if(it.armor) f.armor += it.armor;
    if(it.hpBonus) f.hpBonus += it.hpBonus;
    if(it.atkBonus) f.atkBonus += it.atkBonus;
    if(it.crit) f.critChance += it.crit;
    if(it.lifesteal) f.lifesteal += it.lifesteal;
    if(it.thorn) f.thorn += it.thorn;
    if(it.magicBonus) f.magicBonus += it.magicBonus;
  }

  for(const p of backpack){
    const it = ITEMS[p.itemKey];
    if(!it) continue;
    if(it.type==="weapon"){
      let dmg = it.dmg + f.atkBonus;
      if(it.magic) dmg = Math.floor(dmg * (1 + f.magicBonus));
      f.weapons.push({name:it.name,dmg,cd:it.cd,timer:it.cd,magic:!!it.magic,icon:ITEM_ICONS[p.itemKey]});
    }
    if(it.type==="potion" && it.heal){
      f.potions.push({name:it.name,heal:it.heal,cd:it.cd,timer:it.cd,icon:ITEM_ICONS[p.itemKey]});
    }
  }

  f.maxHp = baseHp + f.hpBonus;
  f.hp = f.maxHp;
  return f;
}

function startBattle(){
  const oppIds = Object.keys(opponentsCache).filter(id=>id!==state.playerId);
  let opp = null;
  if(oppIds.length){
    const id = oppIds[Math.floor(Math.random()*oppIds.length)];
    opp = opponentsCache[id];
  }

  const me = buildFighter(state.name, state.backpack, state.baseHp, true, state.charKey);

  let enemy;
  if(opp && opp.backpack && opp.backpack.length){
    enemy = buildFighter(opp.name, opp.backpack, opp.maxHp||100, false, opp.charKey||"knight");
  } else {
    const botBp = generateBotBackpack(state.round);
    enemy = buildFighter("Противник", botBp, 80 + state.round*10, false, "knight");
  }

  runBattle(me, enemy);
}

function generateBotBackpack(round){
  const bp = [
    {itemKey:"wood_sword",x:0,y:0,uid:1},
    {itemKey:"leather_armor",x:2,y:0,uid:2}
  ];
  if(round>=2) bp.push({itemKey:"small_potion",x:4,y:0,uid:3});
  if(round>=3) bp.push({itemKey:"iron_sword",x:0,y:2,uid:4});
  if(round>=4) bp.push({itemKey:"chain_armor",x:2,y:2,uid:5});
  if(round>=5) bp.push({itemKey:"silver_ring",x:0,y:4,uid:6});
  if(round>=6) bp.push({itemKey:"long_bow",x:2,y:4,uid:7});
  if(round>=8) bp.push({itemKey:"steel_sword",x:4,y:2,uid:8});
  return bp;
}

function runBattle(me, enemy){
  const log = [];
  const overlay = $("battleOverlay");
  overlay.classList.add("show");
  $("battleCloseBtn").disabled = true;
  $("battleSub").textContent = `Раунд ${state.round}`;
  $("battleLog").innerHTML = "";

  renderFighters(me, enemy);
  addLogLine(log, "info", "⚔️ Бой начался!");
  if(me.weapons.length===0) addLogLine(log, "lose", "⚠️ У вас нет оружия!");
  if(enemy.weapons.length===0) addLogLine(log, "info", "У врага нет оружия!");

  let t = 0;
  const dt = 0.08;
  const maxTime = 90;

  const timer = setInterval(()=>{
    t += dt;

    for(const p of me.potions){
      p.timer -= dt;
      if(p.timer<=0){
        const before = me.hp;
        me.hp = Math.min(me.maxHp, me.hp + p.heal);
        const diff = Math.floor(me.hp - before);
        if(diff>0) addLogLine(log, "heal", `${me.name}: ${p.name} +${diff} HP`);
        p.timer = p.cd;
      }
    }
    for(const p of enemy.potions){
      p.timer -= dt;
      if(p.timer<=0){
        const before = enemy.hp;
        enemy.hp = Math.min(enemy.maxHp, enemy.hp + p.heal);
        const diff = Math.floor(enemy.hp - before);
        if(diff>0) addLogLine(log, "heal", `${enemy.name}: ${p.name} +${diff} HP`);
        p.timer = p.cd;
      }
    }

    for(const w of me.weapons){
      w.timer -= dt;
      if(w.timer<=0){
        let dmg = w.magic ? w.dmg : Math.max(1, w.dmg - enemy.armor);
        const crit = Math.random() < me.critChance;
        if(crit) dmg = Math.floor(dmg*2);
        enemy.hp -= dmg;
        addLogLine(log, "dmg", `${me.name}: ${w.name} → ${dmg}${crit?" (КРИТ!)":""}`);
        spawnDmgNumber("fighterEnemy", dmg, crit);
        const ls = me.lifesteal;
        if(ls>0){
          const heal = Math.floor(dmg*ls);
          if(heal>0){ me.hp = Math.min(me.maxHp, me.hp+heal); addLogLine(log, "heal", `${me.name}: Вампиризм +${heal} HP`); }
        }
        if(enemy.thorn>0){ me.hp -= enemy.thorn; addLogLine(log, "dmg", `${me.name}: Шипы -${enemy.thorn}`); }
        w.timer = w.cd;
      }
    }
    for(const w of enemy.weapons){
      w.timer -= dt;
      if(w.timer<=0){
        let dmg = w.magic ? w.dmg : Math.max(1, w.dmg - me.armor);
        const crit = Math.random() < enemy.critChance;
        if(crit) dmg = Math.floor(dmg*2);
        me.hp -= dmg;
        addLogLine(log, "dmg", `${enemy.name}: ${w.name} → ${dmg}${crit?" (КРИТ!)":""}`);
        spawnDmgNumber("fighterMe", dmg, crit);
        shakeEl("fighterMe");
        const ls = enemy.lifesteal;
        if(ls>0){
          const heal = Math.floor(dmg*ls);
          if(heal>0){ enemy.hp = Math.min(enemy.maxHp, enemy.hp+heal); addLogLine(log, "heal", `${enemy.name}: Вампиризм +${heal} HP`); }
        }
        if(me.thorn>0){ enemy.hp -= me.thorn; addLogLine(log, "dmg", `${enemy.name}: Шипы -${me.thorn}`); }
        w.timer = w.cd;
      }
    }

    renderFighters(me, enemy);

    if(me.hp<=0 || enemy.hp<=0 || t>=maxTime){
      clearInterval(timer);
      me.hp = Math.max(0, me.hp);
      enemy.hp = Math.max(0, enemy.hp);

      let result;
      if(me.hp>0 && enemy.hp<=0){ result="win"; addLogLine(log,"win","🏆 ПОБЕДА!"); }
      else if(me.hp<=0 && enemy.hp>0){ result="lose"; addLogLine(log,"lose","💀 ПОРАЖЕНИЕ"); }
      else if(me.hp<=0 && enemy.hp<=0){ result="win"; addLogLine(log,"win","🤝 ДВОЙНОЙ НОКАУТ — победа!"); }
      else {
        const mp = me.hp/me.maxHp, ep = enemy.hp/enemy.maxHp;
        if(mp>=ep){ result="win"; addLogLine(log,"win","⏱️ Время! Победа по HP"); }
        else { result="lose"; addLogLine(log,"lose","⏱️ Время! Поражение по HP"); }
      }

      renderFighters(me, enemy);

      if(result==="win"){
        state.wins++;
        const reward = 6 + state.round*2;
        state.gold += reward;
        addLogLine(log,"eff",`💰 Награда: +${reward} золота`);
        notify(`Победа! +${reward}💰`,"success");
      } else {
        state.losses++;
        notify("Поражение... но ты выжил","error");
      }

      state.round++;
      state.baseHp += 6;
      state.maxHp = state.baseHp;
      state.hp = state.maxHp;
      generateShop();

      $("battleCloseBtn").disabled = false;
    }
  }, dt*1000);

  $("battleCloseBtn").onclick = ()=>{
    overlay.classList.remove("show");
    renderBackpack(); renderShop(); updateHUD(); saveState();
  };
}

function spawnDmgNumber(targetId, dmg, crit){
  const el = $(targetId);
  if(!el) return;
  const rect = el.getBoundingClientRect();
  const fx = document.createElement("div");
  fx.className = "float-dmg";
  if(crit) fx.style.color = "var(--gold)";
  fx.style.left = (rect.left + rect.width/2 - 20)+"px";
  fx.style.top = (rect.top + 60)+"px";
  fx.textContent = "-"+dmg;
  document.body.appendChild(fx);
  setTimeout(()=>fx.remove(),1000);
}

function shakeEl(id){
  const el = $(id);
  if(!el) return;
  el.classList.remove("shake");
  void el.offsetWidth;
  el.classList.add("shake");
}

function renderFighters(me, enemy){
  const renderF = (f)=>{
    const pct = Math.max(0, f.hp/f.maxHp*100);
    const ch = CHARACTERS[f.charKey] || CHARACTERS.knight;
    return `
      <div class="fighter-head">
        <img class="portrait" src="${f.portrait}" alt="">
        <div>
          <div class="fighter-name">${escapeHtml(f.name)}</div>
          <div class="fighter-role">${ch.name}</div>
        </div>
      </div>
      <div class="hp-bar ${f.isMe?'':'enemy'}">
        <div class="fill" style="width:${pct}%"></div>
        <div class="text">${Math.max(0,Math.floor(f.hp))} / ${f.maxHp}</div>
      </div>
      <div class="stats-row">
        <div class="stat-pill"><span>🛡️</span><span>${f.armor}</span></div>
        <div class="stat-pill"><span>⚔️</span><span>${f.weapons.length}</span></div>
        <div class="stat-pill"><span>💥</span><span>${Math.round(f.critChance*100)}%</span></div>
        <div class="stat-pill"><span>🩸</span><span>${Math.round(f.lifesteal*100)}%</span></div>
      </div>
      <div style="margin-top:8px;font-size:11px;color:var(--muted);line-height:1.6;font-family:'Consolas',monospace;">
        ${f.weapons.map(w=>`${w.name} ${w.dmg}⚔️ / ${w.cd.toFixed(1)}с`).join("<br>") || "нет оружия"}
      </div>
    `;
  };
  $("fighterMe").innerHTML = renderF(me);
  $("fighterEnemy").innerHTML = renderF(enemy);
}

function addLogLine(log, cls, text){
  log.push({cls, text});
  const box = $("battleLog");
  const line = document.createElement("div");
  line.className = "log-line log-"+cls;
  line.textContent = text;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============================================================
// СОХРАНЕНИЕ И ОНЛАЙН
// ============================================================
function saveState(){
  if(!playerRef) return;
  playerRef.update({
    hp: state.hp,
    maxHp: state.maxHp,
    gold: state.gold,
    round: state.round,
    wins: state.wins,
    losses: state.losses,
    backpack: state.backpack,
    lastSeen: firebase.database.ServerValue.TIMESTAMP
  });
}

function listenOpponents(){
  db.ref("players").on("value", snap=>{
    const data = snap.val() || {};
    opponentsCache = data;

    const box = $("opponentsList");
    const arr = Object.entries(data).filter(([id])=>id!==state.playerId);

    if(arr.length===0){
      box.innerHTML = `<div style="color:var(--dim);text-align:center;padding:20px;font-size:12px;">Пока никого нет.<br>Сражайся с ботами!</div>`;
    } else {
      box.innerHTML = arr.map(([id,p])=>{
        const ch = CHARACTERS[p.charKey] || CHARACTERS.knight;
        const key = p.charKey || "knight";
        return `
          <div class="player-row">
            <div class="pr-avatar"><img src="${PORTRAITS[key]}" alt=""></div>
            <div style="flex:1;min-width:0;">
              <div class="pr-name">${escapeHtml(p.name)}</div>
              <div class="pr-sub">${ch.name} · раунд ${p.round||1}</div>
            </div>
            <div class="pr-hp">${p.hp||100} HP</div>
          </div>
        `;
      }).join("");
    }

    const loginBox = $("onlineBox");
    if(loginBox){
      const n = Object.keys(data).length;
      loginBox.innerHTML = n
        ? `<div style="font-weight:700;color:var(--purple2);">Онлайн: ${n}</div><div style="margin-top:6px;font-size:11px;">${Object.values(data).map(p=>escapeHtml(p.name)).join(" · ")}</div>`
        : "Сейчас никто не играет";
    }
  });
}

$("leaveBtn").onclick = async ()=>{
  if(playerRef) await playerRef.remove();
  location.reload();
};

// ============================================================
// СТАРТ
// ============================================================
renderCharacters();
const savedName = localStorage.getItem("bb_name");
if(savedName) $("playerName").value = savedName;
$("playerName").addEventListener("change",()=>localStorage.setItem("bb_name",$("playerName").value));
</script>
</body>
</html>
